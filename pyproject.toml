[project]
name = "indextts"
version = "2.0.0"
description = "IndexTTS2: A Breakthrough in Emotionally Expressive and Duration-Controlled Auto-Regressive Zero-Shot Text-to-Speech"
authors = [{ name = "Bilibili IndexTTS Team" }]
license = "LicenseRef-Bilibili-IndexTTS"
license-files = ["LICEN[CS]E*", "INDEX_MODEL_LICENSE*"]
readme = "README.md"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.8.1",
  "cn2an==0.5.22",
  "cython==3.0.7",
  "descript-audiotools==0.7.2",
  "einops>=0.8.1",
  "fastapi>=0.115.0",
  "ffmpeg-python==0.2.0",
  "g2p-en==2.1.0",
  "jieba==0.42.1",
  "json5==0.10.0",
  "keras==2.9.0",
  "librosa==0.10.2.post1",
  "loguru>=0.7.0",
  "matplotlib==3.8.2",
  "modelscope==1.27.0",
  "munch==4.0.0",
  # ── ninja ────────────────────────────────────────────────────────────────────
  # Required by vllm for JIT compilation of custom CUDA kernels at runtime.
  # Safe to include in base deps — it's a pure build tool with no conflicts.
  "ninja",
  "numba>=0.59.1",
  "numpy==1.26.2",
  "omegaconf>=2.3.0",
  "opencv-python==4.9.0.80",
  "pandas==2.3.2",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "safetensors==0.5.2",
  "sentencepiece>=0.2.1",
  "tensorboard==2.9.1",
  "textstat>=0.7.10",
  "tokenizers==0.21.0",
  "torch==2.4.*",
  "torchaudio==2.4.*",
  "requests>=2.28",
  "tqdm>=4.67.1",
  # ── transformers ─────────────────────────────────────────────────────────────
  # ⚠️  MUST stay at 4.52.1 — this is what IndexTTS2 base inference requires.
  # ⚠️  DO NOT change this to satisfy vllm — vllm is installed separately below
  #     via the [vllm] optional extra using a direct pip install workaround.
  # ⚠️  transformers>=4.57 removes QuantizedCacheConfig from cache_utils,
  #     breaking the IndexTTS2 s2mel/DiT inference pipeline entirely.
  "transformers==4.52.1",
  "uvicorn[standard]>=0.30.0",
  "wetext>=0.0.9; sys_platform != 'linux'",
  "WeTextProcessing; sys_platform == 'linux'",
  "pyzmq>=27.1.0",
  "gradio>=5.45.0",
  "litserve>=0.2.17",
]

[project.optional-dependencies]
# To install the WebUI support, use `uv sync --extra webui` (or `--all-extras`).
webui = [
  "gradio==5.45.0",
]
# To install the DeepSpeed support, use `uv sync --extra deepspeed` (or `--all-extras`).
deepspeed = [
  "deepspeed==0.17.1",
]
test = [
  "pytest>=7.0",
]
# ── vllm extra ───────────────────────────────────────────────────────────────
# ⚠️  DO NOT add vllm here as a normal uv extra.
# vllm==0.16.0 requires transformers>=4.56.0 but our base requires ==4.52.1.
# uv's strict resolver will ALWAYS reject this combination (ResolutionImpossible).
#
# The CORRECT install method is AFTER `uv sync`, run separately:
#   pip install vllm==0.16.0 --no-deps
#   pip install -r https://raw.githubusercontent.com/Ksuriuri/index-tts-vllm/master/requirements.txt -c overrides.txt
#
# This mirrors EXACTLY how the index-tts-vllm project itself installs:
#   pip install uv && uv pip install -r requirements.txt -c overrides.txt
# They bypass uv's strict resolver intentionally for this exact reason.

[tool.pytest.ini_options]
markers = [
    "gpu: tests that require GPU and model checkpoints (deselect with '-m not gpu')",
]

[project.urls]
Homepage = "https://github.com/index-tts/index-tts"
Repository = "https://github.com/index-tts/index-tts.git"

[project.scripts]
indextts = "indextts.cli:main"
indextts2 = "indextts.cli_v2:main"

[build-system]
requires = ["hatchling >= 1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
no-build-isolation-package = ["deepspeed"]

# ── Protobuf conflict resolution (for base deps only) ────────────────────────
# descript-audiotools==0.7.2 requires protobuf < 3.20
# This override keeps protobuf at a version compatible with both
# descript-audiotools at runtime AND vllm when installed via pip --no-deps.
# override-dependencies = [
#   "protobuf>=3.20.0,<4.0.0",
# ]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
